<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vite App</title>
</head>
<body>
    <div>
        <label for="lfo">LFO</label>
        <input type="range" id="lfo" min="0" max="100" value="50">
    </div>
    <div>
        <label for="quality">Mix/Q</label>
        <input type="range" id="quality" min="0" max="100" value="50">
    </div>
    <div>
        <label for="tilt">Tilt</label>
        <input type="range" id="tilt" min="0" max="100" value="50">
    </div>
    <div>
        <label for="volume">Volume</label>
        <input type="range" id="volume" min="0" max="100" value="50">
    </div>
    <div>
        <label for="mode">Mode</label>
        <input type="checkbox" id="mode">
    </div>
    <button id="playPause">Play</button>
    <canvas id="spectrum" width="600" height="200"></canvas>
    <script type="module" src="/index.ts"></script>
</body>
</html>
