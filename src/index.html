<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vite App</title>
</head>
<body>
    <div>
        <label for="volume">Volume</label>
        <input type="range" id="volume" min="0" max="100" value="20">
    </div>
    <div>
        <label for="detune">Detune</label>
        <input type="range" id="detune" min="0" max="100" value="50">
    </div>
    <div>
        <label for="attack">Attack</label>
        <input type="range" id="attack" min="0" max="100" value="50">
    </div>
    <div>
        <label for="release">Release</label>
        <input type="range" id="release" min="0" max="100" value="50">
    </div>
    <button id="playPause">Play</button>
    <canvas id="spectrum" width="600" height="200"></canvas>
    <script type="module" src="/index.ts"></script>
</body>
</html>
