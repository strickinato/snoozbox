<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vite App</title>
</head>
<body>
    <div>
        <label for="volume">Volume</label>
        <input type="range" id="volume" min="-60" max="0" value="-12">
    </div>
    <div>
        <label for="detune">Detune</label>
        <input type="range" id="detune" min="-1200" max="1200" value="0">
    </div>
    <div>
        <label for="attack">Attack</label>
        <input type="range" id="attack" min="0" max="1" step="0.01" value="0.5">
    </div>
    <div>
        <label for="release">Release</label>
        <input type="range" id="release" min="0" max="1" step="0.01" value="0.5">
    </div>
    <script type="module" src="/index.ts"></script>
</body>
</html>
